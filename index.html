<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belle Flamz | Bespoke Fragrant Candles & Exotic Essences</title>
    <meta name="description" content="Discover Belle Flamz, a premier atelier for artisanal candles, exotic fragrances, and bespoke sculptural designs handcrafted with rare botanicals." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Outfit:wght@100;300;400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              magma: "#E9C46A", // Soft Gold / Flame
              bone: "#FEFAE0",  // Vanilla / Silk
              taupe: "#A88B7B", // Sandalwood / Cedar
              obsidian: "#12100E", // Deep Espresso / Smoke
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', "serif"],
              sans: ['"Outfit"', "sans-serif"],
            },
            backgroundImage: {
              "glass-gradient":
                "linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05))",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #12100e;
        color: #fefae0;
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #12100e;
      }
      ::-webkit-scrollbar-thumb {
        background: #e9c46a;
        border-radius: 4px;
      }
      /* Mobile-specific styles */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          width: 4px;
        }
        /* Add padding for mobile bottom navigation */
        .section-container:last-child .section-content {
          padding-bottom: 60px;
        }
      }
      /* Safe area for bottom navigation on iOS */
      .safe-area-inset-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      /* Touch scrolling for internal scrolls */
      .overflow-y-auto,
      .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
      }
      /* Snap scrolling support */
      .snap-x {
        scroll-snap-type: x mandatory;
      }
      .snap-mandatory {
        scroll-snap-type: x mandatory;
      }
      .snap-start {
        scroll-snap-align: start;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "framer-motion": "https://esm.sh/framer-motion@^12.28.1"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
