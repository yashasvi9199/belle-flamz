<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belle Flamz | Kinetic Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Grotesk:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              magma: "#FC5C02",
              bone: "#E2CEAE",
              taupe: "#7C6B51",
              obsidian: "#312B1E",
            },
            fontFamily: {
              serif: ['"Cinzel"', "serif"],
              sans: ['"Space Grotesk"', "sans-serif"],
            },
            backgroundImage: {
              "glass-gradient":
                "linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05))",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Viewport height fallback for mobile browsers */
        --vh-fallback: 100vh;
        --vh-dynamic: 100dvh;
        --section-height: 100vh;
        --section-height-extended: 140vh;
      }
      /* Support for dynamic viewport units */
      @supports (height: 100dvh) {
        :root {
          --section-height: 100dvh;
          --section-height-extended: 140dvh;
        }
      }
      body {
        background-color: #312b1e;
        color: #e2ceae;
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #312b1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #fc5c02;
        border-radius: 4px;
      }
      /* Mobile-specific styles */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          width: 4px;
        }
        /* Use dynamic viewport height on mobile */
        :root {
          --section-height: 100vh;
          --section-height-extended: 140vh;
        }
        @supports (height: 100dvh) {
          :root {
            --section-height: 100dvh;
            --section-height-extended: 140dvh;
          }
        }
        /* Add padding for mobile bottom navigation */
        .section-container:last-child .section-content {
          padding-bottom: 60px;
        }
      }
      /* Safe area for bottom navigation on iOS */
      .safe-area-inset-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      /* Touch scrolling for internal scrolls */
      .overflow-y-auto,
      .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
      }
      /* Snap scrolling support */
      .snap-x {
        scroll-snap-type: x mandatory;
      }
      .snap-mandatory {
        scroll-snap-type: x mandatory;
      }
      .snap-start {
        scroll-snap-align: start;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "framer-motion": "https://esm.sh/framer-motion@^12.28.1"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
